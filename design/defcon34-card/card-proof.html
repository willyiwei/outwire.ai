<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Outwire DEF CON 34 Card Proof</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 48px 24px 72px; background: #242424; color: #fafafa; font-family: Arial, sans-serif; }
    main { max-width: 1240px; margin: auto; }
    h1 { margin: 0 0 8px; font-size: 28px; }
    .note { margin: 0 0 40px; color: #b0b0b0; }
    .proofs { display: grid; gap: 48px; }
    figure { margin: 0; }
    figcaption { margin-bottom: 12px; color: #d4a017; font: 13px ui-monospace, monospace; letter-spacing: .14em; text-transform: uppercase; }
    img { display: block; width: min(100%, 1125px); height: auto; box-shadow: 0 18px 50px #0008; }
    .spec { margin-top: 32px; color: #888; font-size: 14px; line-height: 1.6; }
  </style>
</head>
<body>
  <main>
    <h1>Outwire DEF CON 34 card — first proof</h1>
    <p class="note">Artwork includes 0.125-inch bleed on every edge. Finished size: 3.5 × 2 inches.</p>
    <div class="proofs">
      <figure>
        <figcaption>Front</figcaption>
        <img src="card-front-proof.svg" alt="Front of Outwire checklist card">
      </figure>
      <figure>
        <figcaption>Back</figcaption>
        <img src="card-back-proof.svg" alt="Back of Outwire checklist card">
      </figure>
    </div>
    <p class="spec">Visual proof only. Printer-ready export will be produced after selecting the printer and applying its exact template, color profile, safe area, and PDF requirements.</p>
  </main>
</body>
</html>
